plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qingyue.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.qingyue.reader"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.5.0"
        ndk {
            // 内置 TTS 的 native 库只需 arm64（小米主流机型）；需要支持 32 位设备时加 armeabi-v7a
            abiFilters 'arm64-v8a'
        }
    }

    androidResources {
        // .onnx 模型不压缩，加快安装后复制与加载
        noCompress += ['onnx', 'bin']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    // 内置离线中文 TTS（sherpa-onnx + vits 中文女声模型，模型在 assets/tts/huayan）
    implementation files('libs/sherpa-onnx.aar')
}

// 统一 kotlin-stdlib 版本，避免 jdk7/jdk8 旧包重复类导致构建失败
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
